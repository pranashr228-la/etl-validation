mappings:
  - name: dim_product_category
    sources:
      - table: raw.productcategory
        ignore_columns:
          - rowguid
          - modifieddate

    targets:
      - table: ADVENTUREWORKSDW.TARGET.DIMPRODUCTCATEGORY
        ignore_columns:
          - ProductCategoryKey               # Excluded because it is an Identity/Surrogate Key
          - SpanishProductCategoryName       # Excluded unless you test translation lookups
          - FrenchProductCategoryName        # Excluded unless you test translation lookups

    source_where:
    target_where:

    compare_columns:
      - source_col: productcategoryid
        target_col: ProductCategoryAlternateKey
        data_type: integer
        checks:
          - null_count
          - exact_match
          - hash

      - source_col: name
        target_col: EnglishProductCategoryName
        data_type: string
        checks:
          - null_count
          - min_length
          - max_length
          - exact_match
          - hash

